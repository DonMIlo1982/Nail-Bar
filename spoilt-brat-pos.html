<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spoilt Brat — Till</title>
<style>
:root{
  --paper:#FAF7F9;--surface:#FFFFFF;--ink:#2B2130;--muted:#7A6D7F;--line:#E8DEE6;
  --lacquer:#A3124F;--lacquer-ink:#FFFFFF;--soft:#F6E3EC;--ok:#2E7A63;--warn:#B5501D;
  --serif:"Didot","Bodoni 72","Bodoni MT","Iowan Old Style",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#1C161E;--surface:#272029;--ink:#F3ECF2;--muted:#B3A6B5;--line:#3B3140;
  --lacquer:#E0528F;--lacquer-ink:#1C161E;--soft:#41222F;--ok:#5FC2A3;--warn:#F0A066;color-scheme:dark}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--sans)}
h1,h2{margin:0;font-weight:600}
h1{font-size:22px}h2{font-size:17px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;min-height:40px}
button:hover:not(:disabled){border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--lacquer);border-color:var(--lacquer);color:var(--lacquer-ink);font-weight:600}
button.danger{color:var(--warn)}
button.ghost{background:transparent}
button.block{width:100%;margin-top:8px}
:focus-visible{outline:2px solid var(--lacquer);outline-offset:2px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper);min-height:40px}
.muted{color:var(--muted)}
.empty{color:var(--muted);margin:12px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--tc,var(--lacquer));flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}

header{display:flex;align-items:center;gap:28px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1;color:var(--lacquer);letter-spacing:-.5px}
.brand small{display:block;font:500 12px var(--sans);color:var(--muted);letter-spacing:0;margin-top:3px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{border:none;background:transparent;border-radius:999px;padding:8px 16px}
nav button.on{background:var(--ink);color:var(--paper)}
.today{margin-left:auto;color:var(--muted);font-size:14px}

/* Till */
.till{display:grid;grid-template-columns:270px 1fr 330px;gap:16px;padding:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.catalog{position:sticky;top:84px;max-height:calc(100vh - 100px);display:flex;flex-direction:column;gap:8px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:6px 8px;min-height:36px;font-size:14px}
.seg button.on{background:var(--soft);border-color:var(--lacquer);color:var(--lacquer);font-weight:600}
.cat-list{overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:2px}
.cat-item{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);cursor:grab;user-select:none}
.cat-item:hover{border-color:var(--lacquer)}
.cat-item.dragging{opacity:.5}
.cat-item.out{opacity:.5}
.ci-name{font-weight:600}
.ci-price{grid-row:span 2;align-self:center;font-variant-numeric:tabular-nums}
.ci-meta{font-size:13px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
.tech-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.tech-card{border:1px solid var(--line);border-left:6px solid var(--tc);border-radius:10px;padding:10px 12px;background:var(--paper);min-height:92px;cursor:pointer;transition:background .15s,border-color .15s}
.tech-card.active{border-color:var(--tc);background:var(--surface);box-shadow:0 0 0 2px var(--tc)}
.tech-card.over{background:var(--soft)}
.tech-card.off{opacity:.55}
.tech-card.held{background:repeating-linear-gradient(135deg,var(--paper) 0 8px,color-mix(in srgb,var(--line) 40%,var(--paper)) 8px 16px)}
.tc-bill{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;margin-top:4px}
.tc-bill>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill-tog{min-height:26px;padding:0 8px;font-size:12px;border-radius:999px;flex:none}
.bill-tog.on{background:var(--ok);border-color:var(--ok);color:#fff}
.bill-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.bill-chip{min-height:34px;padding:4px 10px;font-size:13px;border-radius:10px;border-left:4px solid var(--tc);text-align:left}
.bill-chip.on{background:var(--soft);border-color:var(--lacquer);border-left-color:var(--tc);font-weight:600}
.bill-chip .ln-sub{font-weight:400}
.tc-head{display:flex;align-items:center;gap:8px}
.tc-head strong{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tc-sub{font-size:14px;font-variant-numeric:tabular-nums}
.tc-off{font-size:12px;color:var(--muted)}
.drop-hint{margin-top:10px;border:1px dashed var(--line);border-radius:8px;padding:12px;text-align:center;color:var(--muted);font-size:13px}
.lines{list-style:none;margin:8px 0 0;padding:0;font-size:14px}
.lines li{display:grid;grid-template-columns:1fr auto 28px;align-items:center;gap:6px;padding:3px 0;border-top:1px solid var(--line)}
.lines li span:nth-child(2){font-variant-numeric:tabular-nums}
.x{min-height:28px;padding:0;width:28px;border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1}
.x:hover{color:var(--warn)}
.invoice{position:sticky;top:84px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);margin-bottom:10px}
.fld input,.fld select{color:var(--ink);font-size:15px}
.fld.inline{flex-direction:row;align-items:center;gap:10px;white-space:nowrap}
.fld.inline input{width:130px}
.fld-label{font-size:13px;color:var(--muted);margin:10px 0 6px}
.inv-lines{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px 0;margin:6px 0 12px;max-height:34vh;overflow:auto}
.ig{padding:6px 0}
.ig-h{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;margin-bottom:2px}
.trow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:2px 0;font-variant-numeric:tabular-nums}
.totals{margin:4px 0}
.grand{font-size:20px;font-weight:700;padding-top:6px;border-top:1px solid var(--line);margin-top:4px}

/* Pages */
.page{padding:20px;max-width:1150px;margin:0 auto}
.page.narrow{max-width:760px}
.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:22px 0 10px;flex-wrap:wrap}
.page-head:first-child{margin-top:0}
.page-head .fld{margin:0}
.table-wrap{overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:none}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.acts{text-align:right}
td.acts button{min-height:32px;padding:4px 10px;margin-left:4px;font-size:13px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;margin-left:6px;background:var(--soft);color:var(--lacquer)}
.badge.ok{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:14px}
.stat{background:var(--surface);padding:14px 16px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:4px;background:var(--tc);min-width:2px}
.bar-cell{width:28%}

/* Diary */
.diary-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:16px 20px 10px}
.diary-bar input{width:auto}
.diary-bar h1{margin-right:8px}
.spacer{flex:1}
.diary-wrap{margin:0 20px 20px;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;max-height:calc(100vh - 170px)}
.diary{display:grid;position:relative}
.dh{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 8px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.times{position:relative;border-right:1px solid var(--line)}
.times span{position:absolute;right:6px;font-size:12px;color:var(--muted);transform:translateY(-50%)}
.col{position:relative;border-right:1px solid var(--line);cursor:copy;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 63px,var(--line) 63px,var(--line) 64px),
  repeating-linear-gradient(to bottom,transparent 0,transparent 31px,color-mix(in srgb,var(--line) 45%,transparent) 31px,color-mix(in srgb,var(--line) 45%,transparent) 32px)}
.booking{position:absolute;left:4px;right:4px;border-radius:8px;padding:4px 8px;font-size:12px;line-height:1.3;overflow:hidden;cursor:pointer;
  background:color-mix(in srgb,var(--tc) 18%,var(--surface));border-left:4px solid var(--tc);color:var(--ink)}
.booking b{display:block;font-size:13px}
.booking.done{opacity:.55}
.booking.arrived{box-shadow:inset 0 0 0 1px var(--tc)}

/* Modal */
#modal{position:fixed;inset:0;background:rgba(20,10,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:20;overflow:auto}
#modal[hidden]{display:none}
.dialog{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog h2{margin-bottom:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.span2{grid-column:span 2}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.check-list{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chk{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.chk input{width:auto;min-height:0}
.tech-edit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.te-row{display:flex;gap:6px}
.te-row input[type=color]{width:44px;padding:2px;flex:none}
.page.narrow h2{margin:24px 0 10px}
label.btn{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--surface)}
.vat-row{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;grid-column:span 2}
.vat-row input{width:auto;min-height:0}

/* Clients */
.bday-strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.bday{flex:none;min-width:200px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.bday.today{border-color:var(--lacquer);background:var(--soft)}
.bday b{display:block}
.bday .when{font-size:13px;color:var(--lacquer);font-weight:600}
.bday .btns{margin-top:8px}
.bday .btns button{min-height:32px;padding:4px 10px;font-size:13px}
.client-link{display:flex;align-items:center;gap:8px;font-size:13px;margin:-4px 0 10px;flex-wrap:wrap}
.client-link button{min-height:30px;padding:2px 10px;font-size:13px}
.client-card{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:13px;margin:-2px 0 12px}
.client-card .alert{color:var(--warn);font-weight:600}
.consent-note{font-size:12px;color:var(--muted);margin:-4px 0 10px;grid-column:span 2}
.cl-search{max-width:320px}
.hist{margin-top:14px;border-top:1px solid var(--line);padding-top:10px;max-height:220px;overflow:auto;font-size:14px}
.hist .trow{border-bottom:1px solid var(--line);padding:6px 0}
td.wrap{white-space:normal;min-width:160px}

/* Receipt */
.rcpt-preview{background:#fff;color:#111;border-radius:8px;padding:14px;max-width:320px;margin:0 auto 14px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.rcpt{font:12px/1.4 "Courier New",Courier,monospace}
.rcpt .row{display:flex;justify-content:space-between;gap:8px}
.rcpt .r-c{text-align:center}
.rcpt .r-name{font-size:16px;font-weight:700}
.rcpt .r-hr{border-top:1px dashed currentColor;margin:6px 0}
.rcpt .r-tech{font-weight:700;margin-top:4px}
.rcpt .r-total{font-weight:700;font-size:14px}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
#toast[hidden]{display:none}
#print-area{display:none}

/* Header extras */
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hdr-right .today{margin-left:0}
.nag{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);border-radius:999px;padding:2px 4px 2px 12px}
.nag[hidden]{display:none}
.nag button{min-height:28px;padding:2px 10px;font-size:13px;border-radius:999px}
.lock-btn{min-height:32px;padding:4px 12px;font-size:13px;border-radius:999px}
.lock-btn.open{border-color:var(--ok);color:var(--ok)}

/* Invoice lines, payments */
.trow.ln{align-items:center}
.trow.ln .ln-name{flex:1}
.ln-sub{display:block;font-size:12px;color:var(--muted)}
.ed{min-height:26px;padding:0 8px;font-size:12px;border-radius:6px;margin-left:6px}
.pay-rows{margin:8px 0 0}
.pay-row{display:grid;grid-template-columns:70px 1fr 110px 28px;gap:6px;align-items:center;margin-bottom:6px;font-size:14px}
.pay-row.nocode{grid-template-columns:70px 1fr 28px}
.pay-row input{min-height:34px;padding:5px 8px}
.pay-row .vbal{grid-column:2 / span 2;font-size:12px;color:var(--muted);margin-top:-4px}
.pay-left{font-size:14px;font-weight:600;margin-top:4px}
.pay-left.ok{color:var(--ok)}.pay-left.due{color:var(--warn)}
.inv-tools{display:flex;gap:6px;margin:-4px 0 10px}
.inv-tools button{min-height:32px;padding:4px 10px;font-size:13px}

/* Booking extras */
.svc-pick{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px;background:var(--paper);margin-top:4px}
.svc-pick label{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:14px;padding:2px 4px}
.svc-pick input{width:auto;min-height:0}
.svc-sum{font-size:13px;color:var(--muted);margin:4px 0 0}
.status-note{background:var(--soft);border-radius:8px;padding:8px 12px;font-size:14px;margin-bottom:12px}
.notice{margin:0 20px 10px;padding:10px 14px;border-radius:10px;background:var(--soft);font-size:14px}
.cx-list{margin:0 20px 20px}
.cx-list .trow{border-bottom:1px solid var(--line);padding:8px 0}
.badge.void{background:var(--warn);color:#fff}
tr.voided td{color:var(--muted);text-decoration:line-through}
tr.voided td.acts,tr.voided td.st{text-decoration:none}
.rem-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.rem-row .btns{margin:0}
.rem-row .btns button{min-height:32px;padding:4px 10px;font-size:13px}

/* Settings extras */
.te-head,.te-row.wide{display:grid;grid-template-columns:44px 1fr 90px 90px;gap:6px;align-items:center}
.te-head{font-size:12px;color:var(--muted);margin-bottom:4px}
.hours{display:grid;grid-template-columns:110px 1fr 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.hours input[type=checkbox]{width:auto;min-height:0}
.hours label{display:flex;gap:6px;align-items:center;white-space:nowrap}

/* Login */
#login{position:fixed;inset:0;z-index:15;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:16px}
#login[hidden]{display:none}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
.login-card .brand{margin-bottom:16px}
#login-pin{text-align:center;font-size:24px;letter-spacing:8px;margin-bottom:12px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keypad button{min-height:56px;font-size:20px}
.perm-list{display:flex;flex-direction:column;gap:4px;margin:4px 0 10px}
.perm-list label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink)}
.perm-list input{width:auto;min-height:0}

/* Vouchers */
.vc-box{display:grid;grid-template-columns:1fr;gap:8px}
#vc-code{font-size:20px;letter-spacing:2px;text-transform:uppercase}
.vc-result{border-radius:12px;padding:14px 16px;border:2px solid var(--line);font-size:14px}
.vc-result.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 8%,transparent)}
.vc-result.bad{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent)}
.vc-result .big{font-size:18px;font-weight:700;margin-bottom:4px}
.vc-result.ok .big{color:var(--ok)}.vc-result.bad .big{color:var(--warn)}
.badge.st-active{background:transparent;color:var(--ok);border:1px solid var(--ok)}
.badge.st-unsold{background:var(--soft);color:var(--muted)}
.badge.st-used,.badge.st-expired{background:var(--line);color:var(--muted)}
.badge.st-cancelled{background:var(--warn);color:#fff}
@media print{.vslip{page-break-after:always;break-after:page}.vslip:last-child{page-break-after:auto;break-after:auto}}
.vslip .vcode{font:700 20px/1.2 "Courier New",monospace;text-align:center;letter-spacing:1px;border:2px solid #000;padding:6px;margin:6px 0}
.vslip .vval{font-size:22px;font-weight:700;text-align:center}

/* Cash-up */
.cu-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.diff-ok{color:var(--ok);font-weight:700}.diff-bad{color:var(--warn);font-weight:700}

@media (max-width:1150px){.till{grid-template-columns:250px 1fr}.invoice{grid-column:span 2;position:static}}
@media (max-width:760px){
  .till{grid-template-columns:1fr}.invoice{grid-column:auto}.catalog{position:static;max-height:none}
  .form-grid,.check-list,.tech-edit,.cu-grid{grid-template-columns:1fr}
  .hours{grid-template-columns:1fr 1fr}.hours>span{grid-column:span 2}.span2,.vat-row,.consent-note{grid-column:auto}
  .today{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{
  @page{size:80mm auto;margin:3mm}
  body{background:#fff}
  body>*:not(#print-area){display:none!important}
  #print-area{display:block;width:74mm;color:#000}
}
</style>
</head>
<body>
<header>
  <div class="brand">Spoilt Brat<small>Point of sale</small></div>
  <nav>
    <button data-act="tab" data-tab="till" class="on">Till</button>
    <button data-act="tab" data-tab="diary">Diary</button>
    <button data-act="tab" data-tab="clients">Clients</button>
    <button data-act="tab" data-tab="stock">Stock &amp; services</button>
    <button data-act="tab" data-tab="vouchers">Vouchers</button>
    <button data-act="tab" data-tab="cashup">Cash-up</button>
    <button data-act="tab" data-tab="reports">Reports</button>
    <button data-act="tab" data-tab="settings">Settings</button>
  </nav>
  <div class="hdr-right">
    <div class="nag" id="nag" hidden></div>
    <button class="lock-btn" id="lock-btn" data-act="userMenu" hidden></button>
    <div class="today" id="today"></div>
  </div>
</header>
<main id="main"><p class="empty" style="padding:20px">Loading…</p></main>
<div id="modal" hidden data-act="backdrop"><div class="dialog" role="dialog" aria-modal="true" id="modal-body"></div></div>
<div id="login" hidden></div>
<div id="toast" hidden role="status"></div>
<div id="print-area"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];

/* bring data from older versions (or backups) up to the current shape */
function migrate(s){
  const d=defaults();
  s.settings=Object.assign({},d.settings,s.settings||{});
  if(!Array.isArray(s.settings.hours)||s.settings.hours.length!==7)s.settings.hours=defaultHours();
  s.cart=Object.assign(emptyCart(),s.cart||{});if(!Array.isArray(s.cart.payments))s.cart.payments=[];delete s.cart.method;
  if(!Array.isArray(s.cart.held))s.cart.held=[];if(!s.cart.tabs||typeof s.cart.tabs!=='object')s.cart.tabs={};
  ['items','techs','clients','sales','bookings','vouchers','cashups','users','log','refunds'].forEach(k=>{if(!Array.isArray(s[k]))s[k]=d[k]||[]});
  /* the old single owner PIN becomes an Owner login */
  if(s.settings.pin){if(!s.users.length)s.users.push({id:'u'+uid(),name:'Owner',pin:s.settings.pin,role:'owner',perms:[],active:true});delete s.settings.pin;}
  if(!s.settings.logoutMin)s.settings.logoutMin=15;
  if(!s.roster||typeof s.roster!=='object')s.roster={};
  if(!s.nextInv)s.nextInv=1001;
  s.techs.forEach(t=>{if(t.commSvc==null)t.commSvc=0;if(t.commProd==null)t.commProd=0;});
  s.vouchers.forEach(v=>{if(!v.kind)v.kind='sold';if(!v.status)v.status=v.voidedAt?'cancelled':'active';if(!v.uses)v.uses=[];
    if(!v.expires&&v.status!=='unsold')v.expires=addMonths(v.soldAt||v.created||new Date().toISOString(),+s.settings.voucherMonths||36);});
  s.bookings.forEach(b=>{if(!Array.isArray(b.itemIds))b.itemIds=b.itemId?[b.itemId]:[];delete b.itemId;if(!b.status)b.status='booked';});
  return s;
}

  if(!A.length||!B.length||A[0]!==B[0])return false;if(A.length<2||B.length<2)return true;return A[1].startsWith(B[1])||B[1].startsWith(A[1]);}

/* ----- gift voucher codes -----
   Format SB-XXXX-XXXX: 7 random characters plus 1 check character, so a mistyped
   code is caught. No 0/O, 1/I/L to avoid misreading. Every new code is checked
   against the whole register, so a code can never be issued twice. */
const VA='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
const checkChar=body=>VA[[...body].reduce((s,ch,i)=>s+(i+1)*VA.indexOf(ch),0)%VA.length];
const codeLooksValid=c=>{const n=normCode(c);return /^SB[A-Z0-9]{8}$/.test(n)&&[...n.slice(2)].every(ch=>VA.includes(ch))&&checkChar(n.slice(2,9))===n[9];};
const voucherByCode=code=>{const n=normCode(code);return n?state.vouchers.find(v=>normCode(v.code)===n):null;};
function newVoucherCode(){let c;do{const r=new Uint32Array(7);crypto.getRandomValues(r);const body=[...r].map(x=>VA[x%VA.length]).join('');const all=body+checkChar(body);c='SB-'+all.slice(0,4)+'-'+all.slice(4);}while(voucherByCode(c));return c;}
const addMonths=(iso,n)=>{const d=new Date(iso);d.setMonth(d.getMonth()+n);return dateStr(d);};
const fmtD=d=>d?new Date(d.length===10?d+'T00:00':d).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}):'';
/* unsold = pre-printed card not yet sold; active = can be spent */
function vStatus(v){if(v.status==='cancelled'||v.voidedAt)return 'cancelled';if(v.status==='unsold')return 'unsold';if(v.balance<=0.004)return 'used';if(v.expires&&todayStr()>v.expires)return 'expired';return 'active';}
const V_LABEL={active:'Valid',unsold:'Not sold yet',used:'Fully used',cancelled:'Cancelled',expired:'Expired'};
const vKind=v=>v.kind==='issued'?'Free (issued)':v.batch?'Pre-printed card':'Sold';
/* everything the till needs to decide whether to accept a code */
function vCheck(code){
  if(!normCode(code))return{ok:false,msg:'Type or scan the voucher code'};
  const v=voucherByCode(code);
  if(!v)return{ok:false,msg:codeLooksValid(code)?'✗ This code is not on the system. Do not accept it.':'✗ Code not found. Check for a typo.'};
  const st=vStatus(v);const last=(v.uses||[]).filter(u=>u.amount>0).slice(-1)[0];
  const m={unsold:'✗ This card was never sold at the till. Do not accept it.',
    cancelled:'✗ This voucher was cancelled'+(v.cancelReason?': '+v.cancelReason:'')+'.',
    used:'✗ Already fully used'+(last?` on invoice ${last.saleNo}, ${fmtD(last.date)}`:'')+'.',
    expired:`✗ Expired on ${fmtD(v.expires)}.`}[st];
  if(m)return{ok:false,v,msg:m};
  return{ok:true,v,msg:`✓ Valid · balance ${R(v.balance)}${v.recipient?' · for '+v.recipient:''} · until ${fmtD(v.expires)}`};}

/* days until next birthday (0 = today); birthday stored as YYYY-MM-DD or --MM-DD */
function daysToBday(b){
  if(!b)return null;const m=b.match(/(\d{2})-(\d{2})$/);if(!m)return null;
  const now=new Date();now.setHours(0,0,0,0);let next=new Date(now.getFullYear(),+m[1]-1,+m[2]);
  if(next<now)next=new Date(now.getFullYear()+1,+m[1]-1,+m[2]);return Math.round((next-now)/864e5);
}

/* ---------- staff logins & permissions ----------
   Each person has their own PIN. The PIN picks out who is logged in, so PINs must be
   different. This keeps people out of areas they shouldn't use and records who did
   what. It is not strong security: anyone with the backup file can read it. */
const PERMS=[
  ['discount','Give discounts and change prices at the till'],
  ['void','Void or refund sales'],
  ['cancelBooking','Cancel bookings and mark no-shows'],
  ['clients','Open the client list'],
  ['clientExport','Export the client list'],
  ['cashup','Do the cash-up'],
  ['stock','Stock and services: cost prices, deliveries, adding and editing'],
  ['vouchers','Issue free vouchers, create voucher cards, cancel vouchers'],
  ['reports','Reports, turnover and the activity log'],
  ['settings','Settings and staff logins']];
const ROLE_PERMS={owner:PERMS.map(p=>p[0]),

/* activity log: who did what, newest last */
function logAct(action,detail){state.log.push({at:new Date().toISOString(),by:who(),action,detail:detail||''});if(state.log.length>5000)state.log.splice(0,state.log.length-5000);}
/* run fn if the logged-in person may do it; otherwise ask for the PIN of someone who may.
   fn gets the approving user (or null when no approval was needed). */
function need(perm,label,fn){if(can(perm))return fn(null);pendingNeed={perm,label,fn};
  openModal(`<h2>Approval needed</h2><p class="muted" style="margin-top:-6px">${esc(who()||'This login')} is not allowed to ${esc(label)}. Someone who is allowed can approve it with their PIN.</p>

  <div class="btns"><button class="primary" data-act="approve">Approve</button><button class="ghost" data-act="closeModal">Cancel</button></div>`);}

/* Invoice maths. Gift-voucher lines are not discounted and carry no VAT at sale
   (VAT is charged when the voucher is spent on services/products). */
/* ----- technician bills -----
   Everything on the till belongs to a technician's bill. Bills listed in cart.held stay
   on the till but are not on this slip; they can be added or paid separately later.
   cart.tabs[techId] remembers which client each bill is for. */
const isHeld=l=>l.type!=='voucher'&&state.cart.held.includes(l.techId);
const billLines=()=>state.cart.lines.filter(l=>!isHeld(l));
const activePays=()=>state.cart.payments.filter(p=>!p.techId||!state.cart.held.includes(p.techId));
const billTechs=()=>[...new Set(state.cart.lines.filter(l=>l.type!=='voucher').map(l=>l.techId))];
const slipTechs=()=>billTechs().filter(t=>!state.cart.held.includes(t));
const billTotal=t=>r2(state.cart.lines.filter(l=>l.techId===t&&l.type!=='voucher').reduce((s,l)=>s+lineAmt(l),0));
const billClient=t=>(state.cart.tabs[t]||{}).client||'';
/* show the client of the bills on the slip in the client box */
function loadSlipClient(){const c=state.cart;const tabs=slipTechs().map(t=>c.tabs[t]).filter(x=>x&&x.client);
  if(tabs.length)Object.assign(c,{client:tabs[0].client,clientId:tabs[0].clientId||null,email:tabs[0].email||''});
  else if(billTechs().length)Object.assign(c,{client:'',clientId:null,email:''});}
/* the client typed on the slip belongs to every bill on the slip */
function saveSlipClient(){const c=state.cart;slipTechs().forEach(t=>{c.tabs[t]={client:c.client,clientId:c.clientId,email:c.email};});}
function cartTotals(){const c=state.cart;const bl=billLines();
  const goods=r2(bl.filter(l=>l.type!=='voucher').reduce((s,l)=>s+lineAmt(l),0));
  const vou=r2(bl.filter(l=>l.type==='voucher').reduce((s,l)=>s+lineAmt(l),0));
  const disc=r2(Math.min(+c.discount||0,goods));const lineDisc=r2(bl.reduce((s,l)=>s+(+l.disc||0),0));
  return{sub:r2(goods+vou),goods,vou,disc,lineDisc,total:r2(goods-disc+vou),vatBase:r2(goods-disc)};}
function totalsHTML(){const{sub,disc,total,vatBase,lineDisc}=cartTotals();
  return `<div class="trow"><span>Subtotal${lineDisc?` <span class="muted">(after line discounts of ${R(lineDisc)})</span>`:''}</span><span>${R(sub)}</span></div>${disc?`<div class="trow"><span>Discount</span><span>−${R(disc)}</span></div>`:''}${state.settings.vatRegistered?`<div class="trow muted"><span>Includes VAT (15%)</span><span>${R(vatBase*15/115)}</span></div>`:''}<div class="trow grand"><span>Total</span><span>${R(total)}</span></div>`;}
function invLineHTML(l){const subs=[];
  if(l.listPrice!=null&&+l.listPrice!==+l.price)subs.push(`price changed from ${R(l.listPrice)}`);
  if(+l.disc)subs.push(`less ${R(l.disc)}`);if(l.note)subs.push(esc(l.note));if(l.presetCode)subs.push('card '+esc(l.presetCode));if(l.recipient)subs.push('for '+esc(l.recipient));
  return `<div class="trow ln"><span class="ln-name">${l.qty>1?l.qty+' × ':''}${esc(l.name)}${subs.length?`<span class="ln-sub">${subs.join(' · ')}</span>`:''}</span><span>${R(lineAmt(l))}</span><button class="ed" data-act="editLine" data-key="${l.key}" aria-label="Change price or discount for ${esc(l.name)}">Edit</button></div>`;}
function fillInvoice(){

function afterBillChange(){const c=state.cart;c.held=c.held.filter(t=>billTechs().includes(t));

/* ----- payments (only those that belong to the bills on the slip) ----- */
const paidSum=()=>r2(activePays().reduce((s,p)=>s+(+p.amount||0),0));

function syncPayments(){const ps=activePays();const auto=ps.filter(p=>p.auto);
  if(auto.length===1){const others=ps.filter(p=>p!==auto[0]).reduce((s,p)=>s+(+p.amount||0),0);let amt=Math.max(0,r2(cartTotals().total-others));
    if(auto[0].method==='Voucher'){const r=vCheck(auto[0].code);if(r.ok)amt=Math.min(amt,r.v.balance);}auto[0].amount=amt;}}
function payRowsHTML(){const ps=activePays();if(!ps.length)return '';
  const total=cartTotals().total,paid=paidSum(),left=r2(total-paid);const hasCash=ps.some(p=>p.method==='Cash');
  return ps.map(p=>{const v=p.method==='Voucher'?voucherByCode(p.code):null;
    return `<div class="pay-row ${p.method==='Voucher'?'':'nocode'}"><b>${esc(p.method)}</b>
      ${p.method==='Voucher'?`<input data-pay="code" data-pid="${p.id}" value="${esc(p.code||'')}" placeholder="Voucher code" autocomplete="off" aria-label="Voucher code">`:''}
      <input type="number" min="0" step="0.01" inputmode="decimal" data-pay="amount" data-pid="${p.id}" value="${p.amount||''}" aria-label="${esc(p.method)} amount"${p.locked?' readonly':''}>
      <button class="x" data-act="rmPay" data-pid="${p.id}" aria-label="Remove ${esc(p.method)} payment">×</button>
      ${p.method==='Voucher'?`<span class="vbal" data-vbal="${p.id}" style="${normCode(p.code)?`font-weight:600;color:var(--${vCheck(p.code).ok?'ok':'warn'})`:''}">${esc(voucherNote(p.code))}</span>`:''}${p.ref?`<span class="vbal">${esc(p.ref)}</span>`:''}</div>`;}).join('')
    +`<div class="pay-left ${left<=0.004?'ok':'due'}" id="pay-left">${payLeftText(total,paid,hasCash)}</div>`;}
const voucherNote=code=>vCheck(code).msg;
function paintVoucherNote(el,code){if(!el)return;const r=vCheck(code);el.textContent=r.msg;el.style.color=!normCode(code)?'':r.ok?'var(--ok)':'var(--warn)';el.style.fontWeight=normCode(code)?'600':'';}
function payLeftText(total,paid,hasCash){const left=r2(total-paid);if(Math.abs(left)<0.005)return 'Paid in full';
  if(left>0)return `Still to pay: ${R(left)}`;return hasCash?`Change to give: ${R(-left)}`:`Overpaid by ${R(-left)}`;}
function refreshPayLeft(){const el=$('#pay-left');if(!el)return;const total=cartTotals().total,paid=paidSum();const left=r2(total-paid);
  el.className='pay-left '+(left<=0.004?'ok':'due');el.textContent=payLeftText(total,paid,activePays().some(p=>p.method==='Cash'));}

function updateTotals(){const t=$('#inv-totals');if(t)t.innerHTML=totalsHTML();const b=$('#inv-complete');if(b)b.textContent='Complete sale '+R(cartTotals().total);

  if(state.cart.payments.map(p=>p.amount).join()!==before)state.cart.payments.forEach(p=>{if(p.auto){const i=$(`[data-pay="amount"][data-pid="${p.id}"]`);if(i)i.value=p.amount;}});

function stockLeft(it,exceptKey){const inCart=state.cart.lines.filter(l=>l.itemId===it.id&&l.key!==exceptKey).reduce((s,l)=>s+l.qty,0);return(+it.qty||0)-inCart;}
function addLine(techId,itemId){
  const it=itemById(itemId);if(!it||!techById(techId))return;
  if(it.type==='product'&&stockLeft(it)<1){toast(it.qty>0?`Only ${it.qty} × ${it.name} in stock`:`${it.name} is out of stock`);return;}
  /* merge with an identical line only if its price hasn't been changed */
  const ex=state.cart.lines.find(l=>l.techId===techId&&l.itemId===itemId&&+l.price===+it.price&&!+l.disc);
  if(ex)ex.qty++;else state.cart.lines.push({key:uid(),techId,itemId,name:it.name,type:it.type,price:+it.price||0,listPrice:+it.price||0,cost:+it.cost||0,qty:1,disc:0});

  const c=state.cart;if(!c.tabs[techId]&&c.client&&!c.held.includes(techId)&&slipTechs().length===1)c.tabs[techId]={client:c.client,clientId:c.clientId,email:c.email};

ACT.tapItem=a=>{if(!state.cart.activeTech){toast('Select a technician first');return;}addLine(state.cart.activeTech,a.dataset.id);};
ACT.rmLine=a=>{const c=state.cart;const l=c.lines.find(x=>x.key===a.dataset.key);if(!l)return;if(l.qty>1){l.qty--;l.disc=Math.min(+l.disc||0,l.price*l.qty);}else c.lines=c.lines.filter(x=>x!==l);save();fillTechs();fillInvoice();};
/* tapping a method adds a payment row for whatever is still owed; tapping again removes it */
ACT.pay=a=>{const c=state.cart,m=a.dataset.m;const ex=activePays().find(p=>p.method===m&&!p.locked);
  if(ex&&m!=='Voucher'){c.payments=c.payments.filter(p=>p!==ex);}
  else{activePays().forEach(p=>p.auto=false);const left=Math.max(0,r2(cartTotals().total-paidSum()));c.payments.push({id:uid(),method:m,amount:left,auto:true,code:''});}
  save();fillInvoice();if(m==='Voucher'){const ins=$$('[data-pay="code"]');if(ins.length)ins[ins.length-1].focus();}};
ACT.rmPay=a=>{state.cart.payments=state.cart.payments.filter(p=>p.id!==a.dataset.pid);save();fillInvoice();};
/* what stays on the till after the slip is paid or cleared: the bills that were held back */
function keepWaitingBills(){const c=state.cart;const held=c.held;const next=emptyCart();
  next.lines=c.lines.filter(l=>l.type!=='voucher'&&held.includes(l.techId));
  next.payments=c.payments.filter(p=>p.techId&&held.includes(p.techId));
  next.bookingIds=c.bookingIds.filter(id=>{const b=bookingById(id);return b&&held.includes(b.techId);});
  held.forEach(t=>{if(c.tabs[t])next.tabs[t]=c.tabs[t];});
  state.cart=next;loadSlipClient();}
const slipBookingIds=()=>state.cart.bookingIds.filter(id=>{const b=bookingById(id);return !b||!state.cart.held.includes(b.techId);});
ACT.clearCart=()=>{const waiting=state.cart.held.filter(t=>billTechs().includes(t)).length;
  confirmModal(waiting?'Clear this slip?':'Clear this invoice?',`All items, payments and client details on the ${waiting?'slip':'invoice'} will be removed.${waiting?' Bills that are waiting stay on the till.':''}`,'Clear',()=>{const bl=billLines();
    if(bl.length)logAct('Cleared invoice',`${bl.length} item(s): ${bl.map(l=>l.name).join(', ')}, ${R(cartTotals().total)}${state.cart.client?', '+state.cart.client:''}`);
    slipBookingIds().forEach(id=>{const b=bookingById(id);if(b&&b.status==='arrived')b.status='booked'});keepWaitingBills();save();render();});};
ACT.complete=()=>{
  const c=state.cart;const bl=billLines();if(!bl.length)return;syncPayments();
  const{sub,goods,disc,total,vatBase}=cartTotals();
  const pays=activePays().filter(p=>+p.amount>0);const paid=r2(pays.reduce((s,p)=>s+(+p.amount),0));
  if(total>0&&!pays.length){toast('Choose how the client paid');return;}
  if(paid<total-0.004){toast(`${R(total-paid)} still to pay`);return;}
  const cashIn=r2(pays.filter(p=>p.method==='Cash').reduce((s,p)=>s+(+p.amount),0));const change=r2(paid-total);
  if(change>0.004&&change>cashIn+0.004){toast('Payments add up to more than the total. Only cash can be overpaid (for change).');return;}
  for(const p of pays.filter(p=>p.method==='Voucher')){const r=vCheck(p.code);
    if(!r.ok){toast(`Voucher ${p.code||''}: ${r.msg.replace(/^✗ /,'')}`);return;}const v=r.v;
    const usedHere=pays.filter(q=>q.method==='Voucher'&&voucherByCode(q.code)===v).reduce((s,q)=>s+(+q.amount),0);
    if(usedHere>v.balance+0.004){toast(`Voucher ${v.code} only has ${R(v.balance)} left`);return;}}
  for(const l of bl.filter(l=>l.presetCode)){const v=voucherByCode(l.presetCode);if(!v||vStatus(v)!=='unsold'){toast(`Card ${l.presetCode} can no longer be sold. Remove it from the invoice.`);return;}}
  for(const l of bl.filter(l=>l.type==='product')){const it=itemById(l.itemId);if(it&&stockLeft(it)<0){toast(`Not enough ${it.name} in stock`);return;}}
  /* spread the invoice discount over the discountable lines, for turnover per technician */
  const f=goods?(goods-disc)/goods:1;
  const saleId=uid(),now=new Date().toISOString();
  /* cash row records what stayed in the till (tendered minus change) */
  let changeLeft=change>0.004?change:0;
  const payments=pays.map(p=>{const out={method:p.method,amount:r2(+p.amount)};if(p.method==='Cash'&&changeLeft){const take=Math.min(changeLeft,out.amount);out.tendered=out.amount;out.amount=r2(out.amount-take);changeLeft=r2(changeLeft-take);}
    if(p.method==='Voucher'){const v=voucherByCode(p.code);out.code=v.code;if(v.kind==='issued')out.free=true;}if(p.ref)out.ref=p.ref;return out;});
  const sale={id:saleId,no:state.nextInv++,date:now,day:todayStr(),by:who(),byId:currentUser?currentUser.id:null,discountBy:disc?(c.discountBy||who()):'',client:(c.clientId&&clientById(c.clientId)||{}).name||(c.client||'').trim()||'Walk-in',clientId:c.clientId||null,email:(c.email||'').trim(),
    subtotal:sub,discount:disc,total,vatBase,payments,change:change>0.004?change:0,
    method:[...new Set(payments.map(p=>p.method))].join(' + ')||'No charge',bookingIds:slipBookingIds(),
    lines:bl.map(l=>{const amt=lineAmt(l);return{...l,techName:l.type==='voucher'?'':techName(l.techId),net:l.type==='voucher'?amt:r2(amt*f)};})};
  sale.lines.forEach(l=>{if(l.type==='product'){const it=itemById(l.itemId);if(it)it.qty=Math.max(0,(+it.qty||0)-l.qty);}
    if(l.type==='voucher'){const sold={amount:l.price,balance:l.price,recipient:l.recipient||'',buyer:sale.client,buyerId:sale.clientId,saleId,saleNo:sale.no,soldAt:now,soldBy:who(),status:'active',expires:addMonths(now,+state.settings.voucherMonths||36)};
      if(l.presetCode){const v=voucherByCode(l.presetCode);Object.assign(v,sold);l.code=v.code;}   /* pre-printed card: activate it */
      else{l.code=newVoucherCode();state.vouchers.push({id:uid(),code:l.code,kind:'sold',created:now,uses:[],...sold});}
      l.expires=sold.expires;}});
  /* tick off each voucher used: amount, invoice and date go into its history */
  payments.filter(p=>p.method==='Voucher').forEach(p=>{const v=voucherByCode(p.code);v.balance=r2(v.balance-p.amount);v.uses.push({saleId,saleNo:sale.no,amount:p.amount,date:now,client:sale.client,by:who()});});
  state.bookings.forEach(b=>{if(sale.bookingIds.includes(b.id))b.status='done'});
  state.sales.push(sale);
  const changed=sale.lines.filter(l=>l.approvedBy);
  logAct('Sale',`Invoice ${sale.no}, ${R(sale.total)}, ${sale.client}, ${sale.method}${disc?`, invoice discount ${R(disc)}${sale.discountBy!==who()?' approved by '+sale.discountBy:''}`:''}${changed.length?`, price/discount changes: ${changed.map(l=>l.name+(l.approvedBy!==who()?' (approved by '+l.approvedBy+')':'')).join(', ')}`:''}`);
  const waiting=state.cart.held.filter(t=>billTechs().includes(t)).length;
  keepWaitingBills();save();render();showReceipt(sale);
  if(waiting)setTimeout(()=>toast(`${waiting} bill${waiting===1?' is':'s are'} still waiting on the till`),3100);
  const low=[...new Set(sale.lines.filter(l=>l.type==='product').map(l=>l.itemId))].map(itemById).filter(it=>it&&it.qty<=(+it.low||0));
  if(low.length)toast('Low stock: '+low.map(i=>`${i.name} (${i.qty} left)`).join(', '));
};

/* ---------- RECEIPTS ---------- */
/* receipt content as rows, shared by the printed and emailed versions.
   kinds: c=centred, hr=rule, h=heading, row=[left,right], sub=small indented note, b=bold row */
function receiptRows(s){
  const st=state.settings;const d=new Date(s.date);const out=[];const vatBase=s.vatBase??s.total;
  out.push(['name',st.name]);[st.address,st.phone?'Tel '+st.phone:'',st.email,st.vatRegistered&&st.vatNo?'VAT no. '+st.vatNo:''].filter(Boolean).forEach(x=>out.push(['c',x]));
  if(s.voidedAt)out.push(['hr'],['big','*** VOID ***'],['c','Voided '+new Date(s.voidedAt).toLocaleDateString('en-ZA')+(s.voidReason?': '+s.voidReason:'')]);
  out.push(['hr'],['row',`${st.vatRegistered?'Tax invoice':'Invoice'} ${s.no}`,`${d.toLocaleDateString('en-ZA')} ${d.toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'})}`],['t','Client: '+s.client],['hr']);
  const groups=[];s.lines.forEach(l=>{const k=l.type==='voucher'?'__v':l.techId;let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,name:l.type==='voucher'?'Gift vouchers':(l.techName||techName(l.techId)),ls:[]});g.ls.push(l);});
  groups.forEach(g=>{out.push(['h',g.name]);g.ls.forEach(l=>{out.push(['row',(l.qty>1?l.qty+' x ':'')+l.name,R(l.price*l.qty)]);
    if(+l.disc)out.push(['row','  less'+(l.note?' ('+l.note+')':''),'-'+R(l.disc)]);else if(l.note)out.push(['sub',l.note]);
    if(l.code)out.push(['sub','Code: '+l.code+(l.recipient?' · for '+l.recipient:'')],...(l.expires?[['sub','Valid until '+fmtD(l.expires)]]:[]));});});
  out.push(['hr'],['row','Subtotal',R(s.subtotal)]);if(s.discount)out.push(['row','Discount','-'+R(s.discount)]);
  out.push(['b','TOTAL',R(s.total)]);if(st.vatRegistered&&vatBase)out.push(['row','Incl. VAT 15%',R(vatBase*15/115)]);
  out.push(['hr']);salePayments(s).forEach(p=>{out.push(['row',p.method+(p.code?' '+p.code:''),R(p.tendered??p.amount)]);});
  if(s.change)out.push(['row','Change',R(s.change)]);
  if(s.by)out.push(['t','Served by: '+s.by]);
  out.push(['hr'],['c',st.footer]);return out;
}
function receiptHTML(s){
  return `<div class="rcpt">${receiptRows(s).map(([k,a,b])=>({name:`<div class="r-c r-name">${esc(a)}</div>`,c:`<div class="r-c">${esc(a)}</div>`,big:`<div class="r-c r-name">${esc(a)}</div>`,hr:'<div class="r-hr"></div>',
    t:`<div>${esc(a)}</div>`,h:`<div class="r-tech">${esc(a)}</div>`,row:`<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`,b:`<div class="row r-total"><span>${esc(a)}</span><span>${esc(b)}</span></div>`,sub:`<div style="padding-left:10px">${esc(a)}</div>`})[k]).join('')}</div>`;
}
function receiptText(s){
  const W=40;const row=(a,b)=>{a=String(a);b=String(b);return a+' '.repeat(Math.max(1,W-a.length-b.length))+b};
  return receiptRows(s).map(([k,a,b])=>k==='hr'?'-'.repeat(W):(k==='row'||k==='b')?row(k==='b'?a.toUpperCase():a,b):k==='h'?a:k==='sub'?'    '+a:a).join('\n');
}
function showReceipt(s){
  openModal(`<h2>Invoice ${s.no}${s.voidedAt?' <span class="badge void">Voided</span>':''}</h2><div class="rcpt-preview">${receiptHTML(s)}</div>
  <label class="fld">Email receipt to<input id="rc-email" type="email" value="${esc(s.email)}" placeholder="client@example.com"></label>
  <div class="btns"><button class="primary" data-act="printReceipt" data-id="${s.id}">Print receipt</button><button data-act="emailReceipt" data-id="${s.id}">Email receipt</button><button class="ghost" data-act="closeModal">Done</button></div>`);
}
ACT.printReceipt=a=>{const s=saleById(a.dataset.id);if(!s)return;$('#print-area').innerHTML=receiptHTML(s);window.print();};
ACT.emailReceipt=a=>{const s=saleById(a.dataset.id);const to=$('#rc-email').value.trim();if(!to){toast('Enter an email address');return;}s.email=to;save();
  window.open(`mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(`Your receipt from ${state.settings.name} (invoice ${s.no})`)}&body=${encodeURIComponent(receiptText(s))}`,'_blank');};
ACT.reprint=a=>{const s=saleById(a.dataset.id);if(s)showReceipt(s);};

/* ---------- DIARY ---------- */
let diaryDate=todayStr();
/* visible range for a day: opening hours, stretched to fit any booking outside them */
function dayRange(date,bks){const h=hoursFor(date);let s=toMin(h.open),e=toMin(h.close);
  bks.forEach(b=>{s=Math.min(s,toMin(b.start));e=Math.max(e,toMin(b.start)+b.duration);});
  return{start:Math.floor(s/60)*60,end:Math.ceil(e/60)*60};}
function renderDiary(m){
  const off=offTechs(diaryDate);const techs=state.techs.filter(t=>!off.includes(t.id));
  const all=state.bookings.filter(b=>b.date===diaryDate);const bks=all.filter(ACTIVE);const gone=all.filter(b=>!ACTIVE(b));
  const hrs=hoursFor(diaryDate);const{start:DAY_START,end:DAY_END}=dayRange(diaryDate,bks);const H=(DAY_END-DAY_START)/SLOT*SLOT_H;
  let hours='';for(let t=DAY_START;t<=DAY_END;t+=60)hours+=`<span style="top:${(t-DAY_START)/SLOT*SLOT_H}px">${fromMin(t)}</span>`;
  const shade=`linear-gradient(to bottom,color-mix(in srgb,var(--line) 55%,transparent) 0 ${(toMin(hrs.open)-DAY_START)/SLOT*SLOT_H}px,transparent 0 ${(toMin(hrs.close)-DAY_START)/SLOT*SLOT_H}px,color-mix(in srgb,var(--line) 55%,transparent) 0)`;
  m.innerHTML=`<div class="diary-bar">
    <h1>Diary</h1>
    <button data-act="dayShift" data-n="-1" aria-label="Previous day">‹</button>
    <input type="date" id="diary-date" value="${diaryDate}" aria-label="Date">
    <button data-act="dayShift" data-n="1" aria-label="Next day">›</button>
    <button data-act="dayToday">Today</button>
    <span class="muted">${fmtDate(diaryDate)}</span>
    <span class="spacer"></span>
    <button data-act="roster">Who's working (${techs.length})</button>
    <button data-act="reminders">Reminders</button>
    <button class="primary" data-act="newBooking">New booking</button>
  </div>
  ${hrs.closed?`<div class="notice">The salon is normally closed on ${DAYS[new Date(diaryDate+'T00:00').getDay()]}s. You can still add bookings. Change opening hours under Settings.</div>`:''}
  ${techs.length?`<div class="diary-wrap"><div class="diary" style="grid-template-columns:56px repeat(${techs.length},minmax(150px,1fr))">
    <div class="dh"></div>${techs.map(t=>`<div class="dh" style="--tc:${t.color}"><span class="dot"></span>${esc(t.name)}</div>`).join('')}
    <div class="times" style="height:${H}px">${hours}</div>
    ${techs.map(t=>`<div class="col" data-act="colClick" data-tech="${t.id}" data-start="${DAY_START}" data-end="${DAY_END}" style="height:${H}px">${hrs.closed?'':`<div style="position:absolute;inset:0;pointer-events:none;background:${shade}"></div>`}${bks.filter(b=>b.techId===t.id).map(b=>bookingBlock(b,t,DAY_START)).join('')}</div>`).join('')}
  </div></div>`:'<p class="empty" style="padding:0 20px">Nobody is marked as working on this day. Use “Who\'s working” to add technicians.</p>'}
  ${bks.filter(b=>off.includes(b.techId)).length?`<p class="muted" style="padding:0 20px">Some bookings belong to technicians marked as off today. Mark them as working to see them.</p>`:''}
  ${gone.length?`<div class="cx-list"><h2 style="margin:10px 0 4px">Cancelled and no-shows</h2>${gone.map(b=>`<div class="trow"><span>${b.start} · <b>${esc(b.client)}</b> · ${esc(bookingLabel(b))} with ${esc(techName(b.techId))}</span><span><span class="badge">${b.status==='no_show'?'No-show':'Cancelled'}</span> <button class="ed" data-act="openBooking" data-id="${b.id}">Open</button></span></div>`).join('')}</div>`:''}`;
}
const STATUS_LABEL={booked:'',arrived:' (at till)',done:' (paid)'};
function bookingBlock(b,t,dayStart){
  const top=(toMin(b.start)-dayStart)/SLOT*SLOT_H;const h=Math.max(SLOT_H,b.duration/SLOT*SLOT_H)-2;
  return `<div class="booking ${b.status}" data-act="openBooking" data-id="${b.id}" style="top:${top}px;height:${h}px;--tc:${t.color}" role="button" tabindex="0"><b>${esc(b.client)}</b>${b.start} ${esc(bookingLabel(b))}${STATUS_LABEL[b.status]||''}${+b.deposit?' · deposit '+R(b.deposit):''}</div>`;
}

ACT.dayToday=()=>{diaryDate=todayStr();render();};

    <label class="fld">Length (minutes)<input id="bk-dur" type="number" min="15" step="15" value="${b.duration}"></label>
    <label class="fld">Deposit paid (R)<input id="bk-dep" type="number" min="0" step="1" value="${+b.deposit||''}" placeholder="0"></label>

    <button class="ghost" data-act="closeModal">Close</button></div>`);
  updateSvcSum(false);
}
/* total length/price of ticked services; optionally copy the length into the field */
function updateSvcSum(setDur){const its=$$('.svc-chk').filter(c=>c.checked).map(c=>itemById(c.value)).filter(Boolean);
  const mins=its.reduce((s,i)=>s+(+i.duration||0),0),price=its.reduce((s,i)=>s+(+i.price||0),0);
  const el=$('#svc-sum');if(el)el.textContent=its.length?`${its.length} service${its.length===1?'':'s'} · ${mins} min · ${R(price)}`:'Tick at least one service';
  if(setDur&&its.length)$('#bk-dur').value=Math.max(15,Math.ceil(mins/SLOT)*SLOT);}
const clashFor=(v,exceptId)=>{const s=toMin(v.start),e=s+v.duration;return state.bookings.find(b=>b.id!==exceptId&&ACTIVE(b)&&b.date===v.date&&b.techId===v.techId&&toMin(b.start)<e&&toMin(b.start)+b.duration>s);};
ACT.saveBooking=()=>{
  const v={client:$('#bk-client').value.trim(),phone:$('#bk-phone').value.trim(),itemIds:$$('.svc-chk').filter(c=>c.checked).map(c=>c.value),techId:$('#bk-tech').value,date:$('#bk-date').value,start:$('#bk-start').value,duration:Math.max(15,Math.round((+$('#bk-dur').value||30)/5)*5),deposit:Math.max(0,r2(parseFloat($('#bk-dep').value)||0)),notes:$('#bk-notes').value.trim()};
  if(!v.client){toast('Add the client’s name');return;}if(!v.itemIds.length){toast('Tick at least one service');return;}if(!v.date){toast('Choose a date');return;}
  const linked=findClient(v.client)||findClientByPhone(v.phone);v.clientId=linked?linked.id:null;
  if(linked&&!v.phone)v.phone=linked.phone||'';
  const s=toMin(v.start),e=s+v.duration;if(e>SLOT_MAX){toast('That booking runs past '+fromMin(SLOT_MAX));return;}
  const clash=clashFor(v,editingBooking);
  if(clash){toast(`${techName(v.techId)} already has ${clash.client} at ${clash.start}`);return;}
  /* warn (don't block) for days off and outside opening hours */
  const warn=[];const h=hoursFor(v.date);
  if(offTechs(v.date).includes(v.techId))warn.push(`${techName(v.techId)} is marked as off on ${fmtDate(v.date)}. Saving will mark them as working that day.`);
  if(h.closed)warn.push(`The salon is normally closed on ${DAYS[new Date(v.date+'T00:00').getDay()]}s.`);
  else if(s<toMin(h.open)||e>toMin(h.close))warn.push(`This is outside opening hours (${h.open}–${h.close}).`);
  if(linked&&findClient(v.client)!==linked){warn.push(`This cellphone number belongs to ${linked.name}. The booking will be saved under their name.`);v.client=linked.name;}
  const id=editingBooking;
  const commit=()=>{const desc=`${v.client}, ${bookingLabel(v)} with ${techName(v.techId)}, ${v.date} ${v.start}`;
    if(id){const old=bookingById(id);const moved=old.date!==v.date||old.start!==v.start||old.techId!==v.techId;Object.assign(old,v,{updatedBy:who(),updatedAt:new Date().toISOString()});
      logAct(moved?'Moved booking':'Edited booking',desc);}
    else{state.bookings.push({id:uid(),status:'booked',created:new Date().toISOString(),createdBy:who(),...v});logAct('New booking',desc);}
    if(offTechs(v.date).includes(v.techId))state.roster[v.date]=offTechs(v.date).filter(x=>x!==v.techId);
    save();closeModal();diaryDate=v.date;render();toast('Booking saved');};
  if(!warn.length)return commit();
  confirmModal('Check before saving',warn.join('\n\n'),'Save booking',commit,{noLabel:'Go back',onNo:()=>bookingForm({...(id?bookingById(id):{status:'booked'}),...v,id})});
};
function setBookingStatus(status,label){const id=editingBooking;const b=bookingById(id);if(!b)return;
  need('cancelBooking',label==='cancel'?'cancel bookings':'mark no-shows',ap=>confirmModal(label==='cancel'?'Cancel this booking?':'Mark as a no-show?',`${b.client}, ${b.start} on ${fmtDate(b.date)}. The time slot becomes free again and the booking stays in the client's history.`,label==='cancel'?'Cancel booking':'Mark no-show',
    ()=>{b.status=status;b[status==='cancelled'?'cancelledAt':'noShowAt']=new Date().toISOString();b.statusBy=who();if(ap)b.statusApprovedBy=ap.name;
      logAct(status==='cancelled'?'Cancelled booking':'No-show',`${b.client}, ${bookingLabel(b)} with ${techName(b.techId)}, ${b.date} ${b.start}${ap?' (approved by '+ap.name+')':''}`);
      save();render();toast(label==='cancel'?'Booking cancelled':'Marked as no-show');},{noLabel:'Go back',onNo:()=>bookingForm(b)}));}

ACT.restoreBooking=()=>{const b=bookingById(editingBooking);if(!b)return;const c=clashFor(b,b.id);

ACT.bookingToTill=()=>{
  const b=bookingById(editingBooking);if(!b)return;if(state.cart.bookingIds.includes(b.id)){toast('This booking is already on the till');return;}

};

ACT.saveClient=()=>{
  const name=$('#cl-name').value.trim().replace(/\s+/g,' ');if(!name){toast('Add the client’s name');return;}

ACT.saveItem=a=>{
  const type=a.dataset.type;const name=$('#it-name').value.trim();const price=parseFloat($('#it-price').value);
  if(!name){toast('Give it a name');return;}if(!(price>=0)){toast('Enter a price');return;}
  const v={type,name,category:$('#it-cat').value.trim(),cost:Math.max(0,parseFloat($('#it-cost').value)||0),price};
  if(type==='service')v.duration=Math.max(5,parseInt($('#it-dur').value)||30);
  else{v.code=$('#it-code').value.trim();v.qty=parseInt($('#it-qty').value)||0;v.low=Math.max(0,parseInt($('#it-low').value)||0);}
  if(editingItem){const old=itemById(editingItem);const ch=['price','cost','qty'].filter(k=>k in v&&+old[k]!==+v[k]).map(k=>`${k} ${old[k]}→${v[k]}`);
    Object.assign(old,v);logAct('Edited item',name+(ch.length?': '+ch.join(', '):''));}
  else{state.items.push({id:uid(),...v});logAct('Added item',`${name} (${type}) ${R(price)}`);}

ACT.delItem=a=>{const it=itemById(a.dataset.id);if(!it)return;need('stock','delete services or products',()=>confirmModal(`Delete ${it.name}?`,'Past sales keep their history. It will no longer appear on the till.','Delete',()=>{state.items=state.items.filter(i=>i.id!==it.id);logAct('Deleted item',it.name);save();render();}));};

    ${rows.map(r=>`<tr><td><span class="dot" style="--tc:${r.color};margin-right:8px;vertical-align:-1px"></span>${esc(r.name)}</td><td class="n">${r.clients}</td><td class="n">${r.count}</td><td class="n">${R(r.svc)}</td><td class="n">${R(r.prod)}</td><td class="n"><b>${R(r.total)}</b></td><td class="n" title="${r.commSvc}% of services, ${r.commProd}% of products">${R(r.comm)}<br><span class="muted" style="font-size:12px">${r.commSvc}% / ${r.commProd}%</span></td><td class="bar-cell"><div class="bar" style="--tc:${r.color};width:${r.total/max*100}%"></div></td></tr>`).join('')}
    <tr><td><b>Total</b></td><td></td><td></td><td></td><td></td><td class="n"><b>${R(svc+prod)}</b></td><td class="n"><b>${R(rows.reduce((s,r)=>s+r.comm,0))}</b></td><td></td></tr>

    ${pr.length?`<tr><td><b>Total</b></td><td class="n">${pr.reduce((s,i)=>s+(+i.qty||0),0)}</td><td></td><td class="n"><b>${R(pr.reduce((s,i)=>s+i.qty*i.cost,0))}</b></td><td class="n"><b>${R(pr.reduce((s,i)=>s+i.qty*i.price,0))}</b></td><td></td></tr>`:''}

    <div class="page-head"><h2>Activity log</h2><div class="btns" style="margin:0"><select id="log-who" style="width:auto">${['',...new Set(state.log.map(l=>l.by).filter(Boolean))].map(n=>`<option value="${esc(n)}" ${n===logWho?'selected':''}>${n?esc(n):'Everyone'}</option>`).join('')}</select><input id="log-q" type="search" placeholder="Search" value="${esc(logQ)}" style="width:180px"><button data-act="csvLog">Export CSV</button></div></div>

/* sales table rows, used in Reports and in the till's "Today's sales" */
function salesTableHTML(list,empty){return `<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Date</th><th>Client</th><th>Technicians</th><th>Cashier</th><th>Paid by</th><th class="n">Total</th><th></th></tr></thead><tbody>

    <td class="acts st">${s.voidedAt?`<span class="badge void" title="${esc((s.voidReason||'')+(s.voidedBy?' · by '+s.voidedBy:'')+(s.voidApprovedBy?' · approved by '+s.voidApprovedBy:''))}">Voided${s.voidedBy?' by '+esc(s.voidedBy):''}</span>`:`<button class="danger" data-act="voidSale" data-id="${s.id}">Void / refund</button>`}<button data-act="reprint" data-id="${s.id}">Receipt</button></td></tr>`).join('')||`<tr><td colspan="8" class="muted">${empty}</td></tr>`}
  </tbody></table></div>`;}
function cashierRows(){const per={};monthAll().forEach(s=>{const k=s.by||'(no login)';const p=per[k]||(per[k]={name:k,n:0,total:0,disc:0,voids:0,voidTotal:0});
  if(s.voidedAt){p.voids++;p.voidTotal+=s.total;}else{p.n++;p.total+=s.total;p.disc+=(+s.discount||0)+s.lines.reduce((a,l)=>a+(+l.disc||0),0);}});return Object.values(per).sort((a,b)=>b.total-a.total);}
let logWho='',logQ='';
const logList=()=>state.log.filter(l=>(!logWho||l.by===logWho)&&(!logQ||(l.action+' '+l.detail+' '+l.by).toLowerCase().includes(logQ.toLowerCase())));
function fillLog(){const el=$('#log-body');if(!el)return;const list=logList().slice(-300).reverse();

/* ----- void / refund a whole invoice: number is kept, stock and vouchers put back ----- */
let voidApprover=null;
ACT.voidSale=a=>need('void','void or refund a sale',ap=>{voidApprover=ap;const s=saleById(a.dataset.id);if(!s||s.voidedAt)return;
  const sold=s.lines.filter(l=>l.type==='voucher'&&l.code).map(l=>voucherByCode(l.code)).filter(Boolean);
  const refunded=sold.filter(v=>v.refund);
  if(refunded.length){toast(`Voucher ${refunded[0].code} on this invoice was already refunded, so voiding it would pay the client back twice`);return;}
  const used=sold.filter(v=>v.balance<v.amount-0.004);
  if(used.length){toast(`Voucher ${used[0].code} from this sale has already been used, so this invoice can’t be voided`);return;}
  openModal(`<h2>Void invoice ${s.no}?</h2><p class="muted" style="margin-top:-6px">${esc(s.client)} · ${R(s.total)} · ${esc(s.method)}</p>
  <p style="font-size:14px">The invoice number stays in the records marked as voided. Products go back into stock${sold.length?', gift vouchers sold on it are cancelled':''}${salePayments(s).some(p=>p.method==='Voucher')?', voucher payments go back onto the voucher':''}. Refund the client the same way they paid.</p>
  <label class="fld">Reason<input id="void-reason" placeholder="e.g. client refunded, rung up twice" autocomplete="off"></label>
  <div class="btns"><button class="danger" data-act="confirmVoid" data-id="${s.id}">Void invoice</button><button class="ghost" data-act="closeModal">Cancel</button></div>`);});
ACT.confirmVoid=a=>{const s=saleById(a.dataset.id);if(!s)return;const reason=$('#void-reason').value.trim();if(!reason){toast('Add a reason');return;}
  const now=new Date().toISOString();s.voidedAt=now;s.voidReason=reason;s.voidedBy=who();if(voidApprover)s.voidApprovedBy=voidApprover.name;
  logAct('Voided sale',`Invoice ${s.no}, ${R(s.total)}, ${s.client}: ${reason}${voidApprover?' (approved by '+voidApprover.name+')':''}`);
  s.lines.forEach(l=>{if(l.type==='product'){const it=itemById(l.itemId);if(it)it.qty=(+it.qty||0)+l.qty;}
    if(l.type==='voucher'&&l.code){const v=voucherByCode(l.code);if(v){v.voidedAt=now;v.status='cancelled';v.cancelReason=`invoice ${s.no} voided`;v.balance=0;}}});
  salePayments(s).filter(p=>p.method==='Voucher').forEach(p=>{const v=voucherByCode(p.code);if(v&&!v.voidedAt){v.balance=r2(v.balance+p.amount);v.uses.push({saleId:s.id,saleNo:s.no,amount:-p.amount,date:now,note:'invoice voided'});}});
  save();closeModal();render();toast(`Invoice ${s.no} voided`);};
ACT.csvTech=()=>download(`technician-turnover-${repMonth}.csv`,[['Technician','Clients','Services done','Services (R)','Products (R)','Total (R)','Commission % services','Commission % products','Commission (R)'],...techRows().map(r=>[r.name,r.clients,r.count,r.svc.toFixed(2),r.prod.toFixed(2),r.total.toFixed(2),r.commSvc,r.commProd,r.comm.toFixed(2)])].map(r=>r.map(csvCell).join(',')).join('\n'));
ACT.csvStock=()=>download(`stock-${todayStr()}.csv`,[['Product','Category','Code','In stock','Reorder at','Cost price','Retail price','Value at cost','Value at retail'],...state.items.filter(i=>i.type==='product').map(i=>[i.name,i.category,i.code,i.qty,i.low,i.cost,i.price,(i.qty*i.cost).toFixed(2),(i.qty*i.price).toFixed(2)])].map(r=>r.map(csvCell).join(',')).join('\n'));
ACT.csvSales=()=>{const rows=[['Invoice','Date','Client','Technician','Item','Type','Qty','Price each','Line discount','Line after all discounts','Paid by','Voided','Void reason']];monthAll().forEach(s=>s.lines.forEach(l=>rows.push([s.no,new Date(s.date).toLocaleString('en-ZA'),s.client,l.techName,l.name+(l.code?' '+l.code:''),l.type,l.qty,l.price,+l.disc||0,l.net,salePayments(s).map(p=>p.method+' '+(+p.amount).toFixed(2)).join(' + '),s.voidedAt?'Yes':'',s.voidReason||''])));download(`sales-${repMonth}.csv`,rows.map(r=>r.map(csvCell).join(',')).join('\n'));};
