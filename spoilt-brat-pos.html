/* ---------- CASH-UP (end of day) ---------- */
let cuDate=todayStr();
const localDay=iso=>iso?dateStr(new Date(iso)):'';
const saleDay=s=>s.day||localDay(s.date);
/* Money for one day, the way the till sees it:
   - a sale counts on the day it was rung up, unless it was voided that same day;
   - money paid back on the day (sales from earlier days voided today, and voucher
     refunds) comes off that day's figures under the method it was paid back by. */
function dayFigures(date){
  const all=state.sales.filter(s=>saleDay(s)===date);
  const sales=all.filter(s=>!(s.voidedAt&&localDay(s.voidedAt)===date));
  const voidsToday=state.sales.filter(s=>s.voidedAt&&localDay(s.voidedAt)===date);
  const voids=voidsToday.filter(s=>saleDay(s)===date);
  const refunds=[];
  voidsToday.filter(s=>saleDay(s)!==date).forEach(s=>salePayments(s).forEach(p=>refunds.push({method:p.free?'Free voucher':p.method,amount:r2(+p.amount||0),what:`Invoice ${s.no} (${fmtD(saleDay(s))}) voided`})));
  state.refunds.filter(r=>r.day===date).forEach(r=>refunds.push({method:r.method,amount:r.amount,what:`Voucher ${r.code} refunded`,voucher:true}));
  const mt=methodTotals(sales);refunds.forEach(r=>{mt[r.method]=r2((mt[r.method]||0)-r.amount);});
  const gross=r2(sales.reduce((a,s)=>a+s.total,0));const refundTotal=r2(refunds.reduce((a,r)=>a+r.amount,0));
  const vsold=sales.reduce((a,s)=>a+s.lines.filter(l=>l.type==='voucher').reduce((b,l)=>b+l.net,0),0);
  const vref=refunds.filter(r=>r.voucher).reduce((a,r)=>a+r.amount,0);
  return{all,sales,mt,gross,refunds,refundTotal,total:r2(gross-refundTotal),vsold:r2(vsold-vref),voids,discounts:r2(sales.reduce((a,s)=>a+(+s.discount||0)+s.lines.reduce((b,l)=>b+(+l.disc||0),0),0))};}
function renderCashup(m){
  const f=dayFigures(cuDate);const saved=state.cashups.filter(c=>c.date===cuDate).slice(-1)[0];
  const methods=[...new Set([...PAY_METHODS,'Deposit',...Object.keys(f.mt)])].filter(k=>k!=='Voucher'||f.mt[k]);const notMoney=k=>k==='Voucher'||k==='Free voucher';
  m.innerHTML=`<div class="page">
    <div class="page-head"><h1>Cash-up</h1><label class="fld inline">Day<input id="cu-date" type="date" value="${cuDate}"></label></div>
    <p class="muted" style="margin-top:-4px">${fmtDate(cuDate)} · ${f.sales.length} invoice${f.sales.length===1?'':'s'}${saved?` · <span style="color:var(--ok)">cashed up at ${new Date(saved.at).toLocaleTimeString('en-ZA',{hour:'2-digit',minute:'2-digit'})}</span>`:''}</p>
    <div class="cu-grid">
      <div class="table-wrap"><table><thead><tr><th>Takings by method</th><th class="n">System</th></tr></thead><tbody>
        ${methods.map(k=>`<tr><td>${esc(k)}${k==='Deposit'?' <span class="muted">(paid earlier)</span>':''}${notMoney(k)?' <span class="muted">(not money in)</span>':''}</td><td class="n">${R(f.mt[k]||0)}</td></tr>`).join('')}
        ${f.refunds.length?`<tr><td colspan="2" style="padding-bottom:2px"><b>Paid back today</b> <span class="muted">(already taken off the amounts above)</span></td></tr>
          ${f.refunds.map(r=>`<tr><td class="muted" style="padding-left:24px">${esc(r.what)} · ${esc(r.method)}</td><td class="n muted">−${R(r.amount)}</td></tr>`).join('')}`:''}
        <tr><td><b>Total takings</b>${f.refundTotal?' <span class="muted">(after refunds)</span>':''}</td><td class="n"><b>${R(f.total)}</b></td></tr>
        ${f.vsold?`<tr><td class="muted">Includes gift vouchers sold${f.refunds.some(r=>r.voucher)?' (less refunds)':''}</td><td class="n muted">${R(f.vsold)}</td></tr>`:''}
        ${f.discounts?`<tr><td class="muted">Discounts given</td><td class="n muted">${R(f.discounts)}</td></tr>`:''}
        ${f.voids.length?`<tr><td class="muted">Rung up and voided today (${f.voids.length}), not counted</td><td class="n muted">${R(f.voids.reduce((a,s)=>a+s.total,0))}</td></tr>`:''}
      </tbody></table></div>
      <div class="panel">
        <label class="fld">Opening float in the till (R)<input id="cu-float" type="number" min="0" step="0.01" value="${saved?saved.float:''}" placeholder="0"></label>
        <label class="fld">Cash counted in the till now (R)<input id="cu-cash" type="number" min="0" step="0.01" value="${saved?saved.counted:''}"></label>
        <label class="fld">Card machine end-of-day total (R)<input id="cu-card" type="number" min="0" step="0.01" value="${saved&&saved.cardBatch!=null?saved.cardBatch:''}" placeholder="Optional"></label>
        <label class="fld">Notes<input id="cu-notes" value="${esc(saved?saved.notes:'')}" autocomplete="off"></label>
        <div id="cu-diff">${cuDiffHTML()}</div>
        <div class="btns"><button class="primary" data-act="saveCashup">Save cash-up</button><button data-act="printCashup">Print slip</button></div>
      </div>
    </div>
    ${state.cashups.length?`<div class="page-head"><h2>Recent cash-ups</h2></div><div class="table-wrap"><table><thead><tr><th>Day</th><th class="n">Takings</th><th class="n">Cash expected</th><th class="n">Cash counted</th><th class="n">Difference</th><th>Notes</th></tr></thead><tbody>
      ${state.cashups.slice(-14).reverse().map(c=>`<tr><td>${new Date(c.date+'T00:00').toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'short'})}</td><td class="n">${R(c.total)}</td><td class="n">${R(c.expectedCash)}</td><td class="n">${R(c.counted)}</td><td class="n ${Math.abs(c.diff)<0.005?'diff-ok':'diff-bad'}">${R(c.diff)}</td><td class="wrap">${esc(c.notes||'')}${c.by?` <span class="muted">· ${esc(c.by)}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`:''}
  </div>`;
}
function cuValues(){const f=dayFigures(cuDate);const fl=parseFloat(($('#cu-float')||{}).value)||0;const cashEl=$('#cu-cash'),cardEl=$('#cu-card');
  const counted=cashEl&&cashEl.value!==''?parseFloat(cashEl.value):null;const card=cardEl&&cardEl.value!==''?parseFloat(cardEl.value):null;
  const expectedCash=r2(fl+(f.mt.Cash||0));return{f,float:r2(fl),counted,card,expectedCash,diff:counted==null?null:r2(counted-expectedCash),cardDiff:card==null?null:r2(card-(f.mt.Card||0))};}
function cuDiffHTML(){const v=cuValues();const cls=d=>Math.abs(d)<0.005?'diff-ok':'diff-bad';const word=d=>Math.abs(d)<0.005?'Balances':d>0?'Over by '+R(d):'Short by '+R(-d);
  return `<div class="trow"><span>Cash expected (float + cash sales${v.f.refunds.some(r=>r.method==='Cash')?' − cash refunds':''})</span><span>${R(v.expectedCash)}</span></div>
    ${v.diff!=null?`<div class="trow"><span>Cash</span><span class="${cls(v.diff)}">${word(v.diff)}</span></div>`:''}
    ${v.cardDiff!=null?`<div class="trow"><span>Card machine vs system</span><span class="${cls(v.cardDiff)}">${word(v.cardDiff)}</span></div>`:''}`;}
ACT.saveCashup=()=>{const v=cuValues();if(v.counted==null){toast('Enter the cash counted');return;}
  logAct('Cash-up',`${cuDate}: takings ${R(v.f.total)}, cash ${Math.abs(v.diff)<0.005?'balances':(v.diff>0?'over ':'short ')+R(Math.abs(v.diff))}`);
  const rec={id:uid(),date:cuDate,at:new Date().toISOString(),by:who(),float:v.float,counted:r2(v.counted),expectedCash:v.expectedCash,diff:v.diff,cardBatch:v.card,cardDiff:v.cardDiff,total:v.f.total,methods:v.f.mt,refunds:v.f.refunds,invoices:v.f.sales.length,notes:$('#cu-notes').value.trim()};
  state.cashups=state.cashups.filter(c=>c.date!==cuDate);state.cashups.push(rec);state.cashups.sort((a,b)=>a.date.localeCompare(b.date));
  save();render();toast('Cash-up saved'+(Math.abs(v.diff)<0.005?'':': cash '+(v.diff>0?'over':'short')+' by '+R(Math.abs(v.diff))));};
ACT.printCashup=()=>{const v=cuValues();const st=state.settings;const row=(a,b)=>`<div class="row"><span>${esc(a)}</span><span>${esc(b)}</span></div>`;
  $('#print-area').innerHTML=`<div class="rcpt"><div class="r-c r-name">${esc(st.name)}</div><div class="r-c">CASH-UP · ${esc(new Date(cuDate+'T00:00').toLocaleDateString('en-ZA'))}</div><div class="r-c">Printed ${new Date().toLocaleString('en-ZA')}</div><div class="r-hr"></div>
    ${row('Invoices',v.f.sales.length)}${Object.entries(v.f.mt).map(([k,a])=>row(k,R(a))).join('')}<div class="row r-total"><span>TOTAL</span><span>${R(v.f.total)}</span></div>
    ${v.f.refunds.length?'<div>Paid back (taken off above):</div>'+v.f.refunds.map(r=>row('  '+r.what+' '+r.method,'-'+R(r.amount))).join(''):''}
    ${v.f.vsold?row('Incl. vouchers sold',R(v.f.vsold)):''}${v.f.discounts?row('Discounts given',R(v.f.discounts)):''}${v.f.voids.length?row(`Voided same day (${v.f.voids.length})`,R(v.f.voids.reduce((a,s)=>a+s.total,0))):''}
    <div class="r-hr"></div>${row('Float',R(v.float))}${row('Cash expected',R(v.expectedCash))}${v.counted!=null?row('Cash counted',R(v.counted))+row('Difference',R(v.diff)):''}
    ${v.card!=null?row('Card machine',R(v.card))+row('Card difference',R(v.cardDiff)):''}<div class="r-hr"></div><div>Counted by: ____________</div><br><div>Checked by: ____________</div></div>`;
  window.print();};

/* ---------- SETTINGS ---------- */
function renderSettings(m){
  const st=state.settings;
  m.innerHTML=`<div class="page narrow"><h1>Settings</h1>
    <h2>Details on receipts</h2>
    <div class="form-grid">
      <label class="fld">Business name<input id="set-name" value="${esc(st.name)}"></label>
      <label class="fld">Phone<input id="set-phone" value="${esc(st.phone)}"></label>
      <label class="fld span2">Address<input id="set-address" value="${esc(st.address)}"></label>
      <label class="fld">Email<input id="set-email" value="${esc(st.email)}"></label>
      <label class="fld">VAT number<input id="set-vat" value="${esc(st.vatNo)}"></label>
      <label class="vat-row"><input type="checkbox" id="set-vatreg" ${st.vatRegistered?'checked':''}>VAT registered (prices include 15% VAT, receipts become tax invoices)</label>
      <label class="fld span2">Message at the bottom of receipts<input id="set-footer" value="${esc(st.footer)}"></label>
    </div>
    <h2>Opening hours</h2>
    <div class="hours">${DAYS.map((d,i)=>{const h=st.hours[i];return `<span>${d}</span><input type="time" step="900" data-ho="${i}" value="${h.open}" aria-label="${d} opens"><input type="time" step="900" data-hc="${i}" value="${h.close}" aria-label="${d} closes"><label><input type="checkbox" data-hx="${i}" ${h.closed?'checked':''}>Closed</label>`;}).join('')}</div>
    <h2>Technicians and commission</h2>
    <div class="te-head"><span></span><span>Name</span><span>% on services</span><span>% on products</span></div>
    <div style="display:flex;flex-direction:column;gap:6px">${state.techs.map(t=>`<div class="te-row wide"><input type="color" data-tc="${t.id}" value="${t.color}" aria-label="Colour for ${esc(t.name)}"><input data-tn="${t.id}" value="${esc(t.name)}" aria-label="Name"><input type="number" min="0" max="100" step="0.5" data-cs="${t.id}" value="${t.commSvc||0}" aria-label="${esc(t.name)} commission on services"><input type="number" min="0" max="100" step="0.5" data-cp="${t.id}" value="${t.commProd||0}" aria-label="${esc(t.name)} commission on products"></div>`).join('')}</div>
    <h2>Gift vouchers and log-out</h2>
    <div class="form-grid">
      <label class="fld">Vouchers are valid for (months)<input id="set-vmonths" type="number" min="36" step="1" value="${st.voucherMonths||36}"></label>
      <label class="fld">Log staff out after (minutes of no use)<input id="set-logout" type="number" min="1" max="240" step="1" value="${st.logoutMin||15}"></label>
      <p class="consent-note">The Consumer Protection Act requires vouchers to be valid for at least 3 years (36 months).</p>
    </div>
    <div class="btns"><button class="primary" data-act="saveSettings">Save settings</button><button data-act="addTech">Add technician</button></div>
    <h2>Staff logins</h2>
    <p class="muted" style="margin-top:-4px">${loginsOn()?'Everyone logs in with their own PIN. Sales, voids, cancellations, stock changes and voucher actions are recorded under their name.':'Logins are off: anyone can use every part of the system. Add an owner login first to turn them on.'}</p>
    <div class="table-wrap"><table><thead><tr><th>Name</th><th>Role</th><th>Can also</th><th>Status</th><th></th></tr></thead><tbody>
      ${state.users.map(u=>`<tr><td><b>${esc(u.name)}</b>${currentUser&&currentUser.id===u.id?' <span class="badge ok">You</span>':''}</td><td>${ROLE_LABEL[u.role]}</td><td class="wrap" style="font-size:13px">${u.role==='owner'?'Everything':esc(PERMS.filter(p=>(u.perms||[]).includes(p[0])).map(p=>p[1].split(':')[0].split(' (')[0]).join('; '))||'<span class="muted">Till and diary only</span>'}</td><td>${u.active===false?'<span class="muted">Disabled</span>':'Active'}</td><td class="acts"><button data-act="editUser" data-id="${u.id}">Edit</button></td></tr>`).join('')||'<tr><td colspan="5" class="muted">No logins yet.</td></tr>'}
    </tbody></table></div>
    <div class="btns"><button class="primary" data-act="addUser">${state.users.length?'Add staff login':'Add owner login'}</button></div>
    <h2>Backup</h2>
    <p class="muted">Data is saved in this browser on this computer only. Download a backup at the end of each day and keep it somewhere safe (e.g. Google Drive). ${st.lastBackup?'Last backup: '+new Date(st.lastBackup).toLocaleString('en-ZA')+'.':'No backup downloaded yet.'}</p>
    <div class="btns"><button data-act="backup">Download backup</button><label class="btn">Restore backup<input id="restore-file" type="file" accept=".json,application/json" hidden></label><button class="danger" data-act="resetAll">Clear all data</button></div>
  </div>`;
}
ACT.saveSettings=()=>{
  Object.assign(state.settings,{name:$('#set-name').value.trim()||'Spoilt Brat',phone:$('#set-phone').value.trim(),address:$('#set-address').value.trim(),email:$('#set-email').value.trim(),vatNo:$('#set-vat').value.trim(),vatRegistered:$('#set-vatreg').checked,footer:$('#set-footer').value.trim()});
  const vm=parseInt($('#set-vmonths').value)||36;if(vm<36){toast('Vouchers must be valid for at least 36 months');return;}
  state.settings.voucherMonths=vm;state.settings.logoutMin=Math.min(240,Math.max(1,parseInt($('#set-logout').value)||15));
  const hours=DAYS.map((_,i)=>({open:$(`[data-ho="${i}"]`).value||'08:00',close:$(`[data-hc="${i}"]`).value||'19:00',closed:$(`[data-hx="${i}"]`).checked}));
  const bad=hours.findIndex(h=>!h.closed&&toMin(h.close)<=toMin(h.open));if(bad>=0){toast(`${DAYS[bad]}: closing time must be after opening time`);return;}
  state.settings.hours=hours;
  state.techs.forEach(t=>{const n=$(`[data-tn="${t.id}"]`),c=$(`[data-tc="${t.id}"]`),cs=$(`[data-cs="${t.id}"]`),cp=$(`[data-cp="${t.id}"]`);if(n&&n.value.trim())t.name=n.value.trim();if(c)t.color=c.value;
    if(cs)t.commSvc=Math.min(100,Math.max(0,parseFloat(cs.value)||0));if(cp)t.commProd=Math.min(100,Math.max(0,parseFloat(cp.value)||0));});
  logAct('Changed settings');save();render();toast('Settings saved');
};
/* ----- staff logins ----- */
let editingUser=null;
function userForm(u){editingUser=u.id||null;const first=!state.users.length;const role=first?'owner':(u.role||'cashier');const perms=u.id?(u.perms||[]):ROLE_PERMS[role];
  openModal(`<h2>${u.id?'Edit '+esc(u.name):first?'Owner login':'New staff login'}</h2>${first?'<p class="muted" style="margin-top:-6px">This is the first login, so it is the owner. Once it is saved, everyone needs a PIN to use the system.</p>':''}
  <div class="form-grid">
    <label class="fld">Name<input id="us-name" value="${esc(u.name||'')}" autocomplete="off"></label>
    <label class="fld">PIN (4 to 8 digits)<input id="us-pin" type="password" inputmode="numeric" autocomplete="new-password" placeholder="${u.id?'Leave blank to keep':''}"></label>
    <label class="fld">Role<select id="us-role" ${first?'disabled':''}>${Object.entries(ROLE_LABEL).map(([k,v])=>`<option value="${k}" ${k===role?'selected':''}>${v}</option>`).join('')}</select></label>
    <label class="vat-row" style="grid-column:auto;align-self:center"><input type="checkbox" id="us-active" ${u.active===false?'':'checked'} ${first?'disabled':''}>Login is active</label>
  </div>
  <div class="fld-label">Allowed to (everyone can use the till and the diary)</div>
  <div class="perm-list" id="us-perms">${PERMS.map(([k,l])=>`<label><input type="checkbox" value="${k}" ${role==='owner'||perms.includes(k)?'checked':''} ${role==='owner'?'disabled':''}>${esc(l)}</label>`).join('')}</div>
  <div class="btns"><button class="primary" data-act="saveUser">Save login</button><button class="ghost" data-act="closeModal">Cancel</button></div>`);}
ACT.addUser=()=>userForm({});
ACT.editUser=a=>{const u=userById(a.dataset.id);if(u)userForm(u);};
ACT.saveUser=()=>{
  const name=$('#us-name').value.trim();const pin=$('#us-pin').value.trim();const role=$('#us-role').value;const active=$('#us-active').checked;
  const existing=editingUser&&userById(editingUser);
  if(!name){toast('Add a name');return;}
  if(!existing&&!pin){toast('Choose a PIN');return;}
  if(pin&&!/^\d{4,8}$/.test(pin)){toast('The PIN must be 4 to 8 digits');return;}
  if(pin&&state.users.some(u=>u.id!==editingUser&&u.pin===pin)){toast('Someone else already uses that PIN. Choose another.');return;}
  if(state.users.some(u=>u.id!==editingUser&&u.name.toLowerCase()===name.toLowerCase())){toast('There is already a login with that name');return;}
  /* never leave the system without an active owner */
  const ownersAfter=state.users.filter(u=>u.id!==editingUser&&u.role==='owner'&&u.active!==false).length+(role==='owner'&&active?1:0);
  if(state.users.length&&ownersAfter<1){toast('There must always be at least one active owner login');return;}
  const perms=role==='owner'?[]:$$('#us-perms input').filter(i=>i.checked).map(i=>i.value);
  if(existing){const was=`${ROLE_LABEL[existing.role]}, ${(existing.perms||[]).join('/')||'-'}`;Object.assign(existing,{name,role,perms,active});if(pin)existing.pin=pin;
    logAct('Changed staff login',`${name}: ${was} → ${ROLE_LABEL[role]}, ${perms.join('/')||'-'}${active?'':' (disabled)'}${pin?', new PIN':''}`);
    if(currentUser&&currentUser.id===existing.id&&!active){currentUser=null;}}
  else{const u={id:'u'+uid(),name,pin,role,perms,active:true,created:new Date().toISOString()};const first=!state.users.length;state.users.push(u);
    if(first){currentUser=u;lastActivity=Date.now();}logAct('Added staff login',`${name} (${ROLE_LABEL[role]})`);}
  save();closeModal();render();toast(name+' saved');};
ACT.addTech=()=>{const n=state.techs.length+1;state.techs.push({id:'t'+uid(),name:'Technician '+n,color:COLORS[(n-1)%COLORS.length],commSvc:0,commProd:0});save();render();};
ACT.backup=()=>{state.settings.lastBackup=new Date().toISOString();download(`spoilt-brat-backup-${todayStr()}.json`,JSON.stringify(state,null,1),'application/json');save();updateNag();};
function restore(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.items||!d.techs)throw 0;confirmModal('Restore this backup?','Everything currently in the system will be replaced with the backup.','Restore',()=>{const by=who();state=migrate(d);currentUser=currentUser&&userById(currentUser.id)||null;logAct('Restored backup',by?'by '+by:'');save();render();toast('Backup restored');});}catch(e){toast('That file is not a Spoilt Brat backup');}};r.readAsText(f);input.value='';}
ACT.resetAll=()=>confirmModal('Clear all data?','Every sale, booking, product and setting will be deleted. Download a backup first if you might need it.','Clear everything',()=>{state=defaults();currentUser=null;save();render();toast('All data cleared');});

/* ---------- global events ---------- */
let tabTimer;
document.addEventListener('click',e=>{lastActivity=Date.now();const a=e.target.closest('[data-act]');if(!a)return;const f=ACT[a.dataset.act];if(f)f(a,e);});
document.addEventListener('keydown',e=>{lastActivity=Date.now();
  if(e.key==='Enter'&&e.target.id==='login-pin'){e.preventDefault();tryLogin();return;}
  if(e.key==='Enter'&&e.target.id==='ap-pin'){e.preventDefault();ACT.approve();return;}
  if(e.key==='Enter'&&e.target.id==='vc-code'){e.preventDefault();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-act]')){e.preventDefault();e.target.click();}});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.cart){state.cart[t.dataset.cart]=t.dataset.cart==='discount'?Math.max(0,parseFloat(t.value)||0):t.value;
    if(t.dataset.cart==='client'){const prev=state.cart.clientId&&clientById(state.cart.clientId);const cl=lookupClient(t.value);state.cart.clientId=cl?cl.id:null;
      /* drop the email that came from a client who is no longer selected */
      if(prev&&prev!==cl&&prev.email&&state.cart.email===prev.email){state.cart.email='';const e=$('[data-cart="email"]');if(e)e.value='';}
      if(cl&&cl.email&&!state.cart.email){state.cart.email=cl.email;const e=$('[data-cart="email"]');if(e)e.value=cl.email;}refreshClientLink();}
    if(t.dataset.cart==='client'||t.dataset.cart==='email'){saveSlipClient();clearTimeout(tabTimer);tabTimer=setTimeout(fillTechs,400);}
    save();if(t.dataset.cart==='discount')updateTotals();}
  if(t.dataset.pay){const p=state.cart.payments.find(x=>x.id===t.dataset.pid);if(p){
    if(t.dataset.pay==='amount'){p.amount=Math.max(0,parseFloat(t.value)||0);p.auto=false;}
    else{p.code=t.value.trim().toUpperCase();const r=vCheck(p.code);const v=r.v;paintVoucherNote($(`[data-vbal="${p.id}"]`),p.code);
      if(r.ok&&p.amount>v.balance){p.amount=v.balance;const ai=$(`[data-pay="amount"][data-pid="${p.id}"]`);if(ai)ai.value=p.amount;}}
    save();refreshPayLeft();}}
  if(t.id&&t.id.startsWith('cu-')&&t.id!=='cu-date'){const d=$('#cu-diff');if(d)d.innerHTML=cuDiffHTML();}
  if(t.id==='gv-card'){const r=cardCheck(t.value);const n=$('#gv-card-note');n.textContent=r.msg;n.style.color=r.ok?'var(--ok)':'var(--warn)';n.style.fontWeight='600';
    /* a card with a value or name saved on it fills them in (they can still be changed here) */
    if(r.ok){if(+r.v.presetAmount&&!$('#gv-amt').value)$('#gv-amt').value=r.v.presetAmount;if(r.v.recipient&&!$('#gv-for').value)$('#gv-for').value=r.v.recipient;}}
  if(t.id==='vc-code'){vcCode=t.value;fillVoucherCheck();}
  if(t.id==='log-q'){logQ=t.value;fillLog();}
  if(t.id==='vr-search'){vrSearch=t.value;fillVoucherTable();}
  if(t.id==='bk-client'){const cl=lookupClient(t.value);if(cl){const p=$('#bk-phone');if(p&&!p.value)p.value=cl.phone||'';const tc=$('#bk-tech');if(tc&&cl.preferredTech&&!editingBooking)tc.value=cl.preferredTech;}}
  if(t.id==='cl-search'){clSearch=t.value;fillClientTable();}
  if(t.id==='cat-search'){catSearch=t.value;fillCat();}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.id==='diary-date'&&t.value){diaryDate=t.value;render();}
  if(t.id==='rep-month'&&t.value){repMonth=t.value;render();}
  if(t.classList.contains('svc-chk'))updateSvcSum(true);
  if(t.id==='us-role'){const r=t.value;$$('#us-perms input').forEach(i=>{i.checked=ROLE_PERMS[r].includes(i.value);i.disabled=r==='owner';});}
  if(t.id==='cu-date'&&t.value){cuDate=t.value;render();}
  if(t.id==='log-who'){logWho=t.value;fillLog();}
  if(t.id==='restore-file')restore(t);
});
